
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নাম ও মোবাইল নম্বর জমা দিন</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f0f4f8;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 10px;
      text-align: center;
      color: #172b4d;
    }

    .description {
      margin-bottom: 25px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .privacy {
      margin-top: 20px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>তথ্য জমা দিন</h2>
    <p class="description">আপনার নাম ও মোবাইল নম্বর লিখুন</p>

    <form id="contactForm">
      <label for="name">আপনার নাম</label>
      <input
        type="text"
        id="name"
        name="name"
        maxlength="100"
        placeholder="সম্পূর্ণ নাম লিখুন"
        autocomplete="name"
        required
      >

      <label for="phone">মোবাইল নম্বর</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="01XXXXXXXXX"
        pattern="01[3-9][0-9]{8}"
        maxlength="11"
        minlength="11"
        inputmode="numeric"
        autocomplete="tel"
        title="সঠিক ১১ সংখ্যার বাংলাদেশি নম্বর লিখুন, যেমন 01712345678"
        required
      >

      <button type="submit" id="submitBtn">Submit</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="privacy">আপনার তথ্য জমা দেওয়ার আগে নম্বরটি সঠিক আছে কি না যাচাই করুন।</p>
  </main>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyHrf4QGVuRnVPVmPnechlI_KmbvVp4y4ABE15GnaE-ZmzzhDdcY0zLnqwFr1TtMxE60A/exec";

    const form = document.getElementById("contactForm");
    const button = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!form.reportValidity()) return;

      button.disabled = true;
      button.textContent = "জমা হচ্ছে...";
      message.textContent = "তথ্য পাঠানো হচ্ছে...";
      message.style.color = "#334155";

      const formData = new URLSearchParams({
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim()
      });

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: formData
        });

        message.textContent =
          "অনুরোধ পাঠানো হয়েছে। Google Sheet-এ তথ্য জমা হয়েছে কি না যাচাই করুন।";
        message.style.color = "#166534";

        form.reset();
      } catch (error) {
        console.error("Submission error:", error);

        message.textContent =
          "তথ্য পাঠানো যায়নি। ইন্টারনেট সংযোগ ও Apps Script URL পরীক্ষা করুন।";
        message.style.color = "#b91c1c";
      } finally {
        button.disabled = false;
        button.textContent = "Submit";
      }
    });
  </script>
</body>
</html>
